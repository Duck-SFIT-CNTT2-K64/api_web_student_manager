services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: btl_api_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Dev default to prevent empty password causing init failures
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    # Dùng chính image mssql/server vì nó kèm sqlcmd v18
    # (/opt/mssql-tools18/bin/sqlcmd) — hỗ trợ -f 65001 cho file UTF-8 BOM.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: btl_api_db_init
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME:-QLSV_TrungTamTinHoc}
      DB_ADMIN_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      SCHEMA_FILE: /scripts/QLSV_TrungTamTinHoc.sql
      BULK_SEED_FILE: /scripts/seed_bulk_data.sql
      RUN_BULK_SEED: ${RUN_BULK_SEED:-auto}
    volumes:
      - ./database:/scripts:ro
      - ./docker/db-init/init-db.sh:/init-db.sh:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        SQLCMD_BIN="/opt/mssql-tools18/bin/sqlcmd"
        if [ ! -x "$${SQLCMD_BIN}" ]; then
          SQLCMD_BIN="/opt/mssql-tools/bin/sqlcmd"
        fi
        echo "[db-init] Waiting for SQL Server at $${DB_SERVER}..."
        until "$${SQLCMD_BIN}" -S "$${DB_SERVER}" -U "$${DB_ADMIN_USER}" -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1; do
          sleep 2
        done
        echo "[db-init] SQL Server is ready."
        echo "[db-init] Importing schema..."
        "$${SQLCMD_BIN}" -S "$${DB_SERVER}" -U "$${DB_ADMIN_USER}" -P "$${MSSQL_SA_PASSWORD}" -C -b -d master -i /scripts/QLSV_TrungTamTinHoc.sql
        echo "[db-init] Database initialization completed."
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btl_api_web
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_SERVER: db
      DB_NAME: ${DB_NAME:-QLSV_TrungTamTinHoc}
      DB_TRUSTED_CONNECTION: "no"
      DB_ENCRYPT: ${DB_ENCRYPT:-yes}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-yes}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-5000}:5000"
    restart: unless-stopped

volumes:
  sqlserver_data:
