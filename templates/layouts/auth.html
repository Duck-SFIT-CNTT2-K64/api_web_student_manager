<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CLASSES369{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('classes369_theme');
                if (!t) {
                    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.style.colorScheme = t;
            } catch (e) { }
        })();
    </script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="auth-topbar">
        <a class="auth-topbar-brand" href="/">
            <span class="auth-topbar-logo">
                <i class="fas fa-graduation-cap"></i>
            </span>
            <span class="auth-topbar-brand-text">
                <strong>CLASSES369</strong>
                <small data-i18n="auth.brand_sub">Applied Computer Training Center</small>
            </span>
        </a>
        <div class="auth-topbar-right">
            <p class="auth-topbar-tagline">
                <span class="auth-topbar-tag-label" data-i18n="auth.platform_tag">LEARNING &amp; MANAGEMENT PLATFORM</span>
            </p>
            <button type="button" class="lang-toggle" data-lang-toggle
                    title="Switch language" aria-label="Switch language" aria-pressed="false"
                    style="margin-right:10px;">
                <span data-lang-label>EN</span>
            </button>
            <button type="button" class="theme-toggle" data-theme-toggle
                    data-i18n-attrs="title,aria-label"
                    data-i18n-title="common.toggle_theme"
                    data-i18n-aria-label="common.toggle_theme"
                    title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">
                <i class="fas fa-moon" data-theme-icon></i>
            </button>
        </div>
    </header>

    <main class="auth-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="auth-footer-bar">
        <p><strong>CLASSES369</strong> &mdash; <span data-i18n="auth.footer_line1">Computer training center management system</span></p>
        <p><span data-i18n="auth.footer_support">Online support:</span> <a href="tel:0901234369">0901 234 369</a>
            &middot; <a href="mailto:hello@classes369.vn">hello@classes369.vn</a>
            &middot; <a href="/" data-i18n="auth.footer_back">Back to homepage</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/i18n-locales.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
