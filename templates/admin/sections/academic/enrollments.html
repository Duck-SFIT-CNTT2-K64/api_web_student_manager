{#
Academic > Enrollment
#}
<section id="enrollments" class="section">
    <div class="section-heading">
        <div>
            <h2 data-i18n="sec.enroll.title">Enrollment</h2>
            <p data-i18n="sec.enroll.subtitle">Enroll students into classes and automatically create the corresponding tuition records.</p>
        </div>
    </div>
    <div class="grid form-and-table">
        <div class="panel">
            <h3 data-i18n="sec.enroll.new">New enrollment</h3>
            <form id="enrollmentForm" class="form-grid">
                <label><span data-i18n="sec.enroll.lbl_student">Student</span> <select name="StudentId" id="enrollmentStudentSelect" required></select></label>
                <label><span data-i18n="sec.enroll.lbl_class">Class</span> <select name="ClassId" id="enrollmentClassSelect" required></select></label>
                <button class="btn btn-primary" type="submit"><i class="fas fa-user-plus"></i> <span data-i18n="sec.enroll.btn">Enroll</span></button>
            </form>
            <p id="enrollmentMessage" class="message"></p>
        </div>
        <div class="panel table-panel">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
                <h3 data-i18n="sec.enroll.list">Enrollments list</h3>
                <div class="filter-controls" style="display: flex; align-items: center; gap: 10px;">
                    <label style="font-size: 0.9rem; color: var(--text-muted); white-space: nowrap;"><span data-i18n="sec.enroll.filter_class">Filter by class:</span></label>
                    <select id="filterEnrollmentClass" style="min-width: 200px;">
                        <option value="" data-i18n="sec.enroll.all_classes">All classes</option>
                    </select>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="sec.enroll.th_student">Student</th>
                            <th data-i18n="sec.enroll.th_class">Class</th>
                            <th data-i18n="sec.enroll.th_course">Course</th>
                            <th data-i18n="sec.enroll.th_date">Enrollment date</th>
                            <th data-i18n="common.status">Status</th>
                            <th data-i18n="sec.enroll.th_tuition">Tuition</th>
                            <th data-i18n="common.actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="enrollmentsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
