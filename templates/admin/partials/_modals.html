{#
    Shared modals used inside the admin dashboard:
      - #pwdModal       : change a user's password
      - #roleModal      : change a user's role
      - #classListModal : view students of a class
#}

<!-- Change password modal -->
<div id="pwdModal"
    style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center">
    <div
        style="background:var(--surface,#1e2433);border:1px solid var(--border,#2d3550);border-radius:16px;padding:28px 32px;max-width:380px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.5)">
        <h3 style="margin-bottom:16px;font-size:1rem"><i class="fas fa-key"
                style="color:var(--primary);margin-right:8px"></i>Change password</h3>
        <p id="pwdModalName" style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px"></p>
        <input id="pwdModalInput" type="password" placeholder="New password (at least 6 characters)"
            style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font-size:.9rem;margin-bottom:12px;box-sizing:border-box">
        <p id="pwdModalMsg" class="message" style="margin-bottom:12px"></p>
        <div style="display:flex;gap:10px">
            <button id="pwdModalSave" class="btn btn-primary" style="flex:1"><i class="fas fa-save"></i> Save</button>
            <button id="pwdModalClose"
                style="flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer">Cancel</button>
        </div>
    </div>
</div>

<!-- Change role modal -->
<div id="roleModal"
    style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center">
    <div
        style="background:var(--surface,#1e2433);border:1px solid var(--border,#2d3550);border-radius:16px;padding:28px 32px;max-width:380px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.5)">
        <h3 style="margin-bottom:16px;font-size:1rem"><i class="fas fa-user-tag"
                style="color:var(--primary);margin-right:8px"></i>Change role</h3>
        <p id="roleModalName" style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px"></p>
        <select id="roleModalSelect"
            style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);margin-bottom:12px">
            <option value="1">Admin</option>
            <option value="2">Teacher</option>
            <option value="3">Student</option>
        </select>
        <p id="roleModalMsg" class="message" style="margin-bottom:12px"></p>
        <div style="display:flex;gap:10px">
            <button id="roleModalSave" class="btn btn-primary" style="flex:1"><i class="fas fa-save"></i> Save</button>
            <button id="roleModalClose"
                style="flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer">Cancel</button>
        </div>
    </div>
</div>

<!-- Class roster modal -->
<div id="classListModal"
    style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center">
    <div
        style="background:var(--surface,#ffffff);border:1px solid var(--border,#e2e8f0);border-radius:16px;padding:24px;max-width:800px;width:90%;max-height:85vh;box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <div>
                <h3 id="classListModalTitle" style="margin:0;font-size:1.2rem;color:var(--primary)">Class roster</h3>
                <div id="classListModalSubtitle" style="font-size:0.85rem;color:var(--text-muted);margin-top:4px"></div>
            </div>
            <button id="classListModalClose"
                style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted)">&times;</button>
        </div>
        <div class="table-wrap" style="flex:1;overflow-y:auto">
            <table style="width:100%;text-align:left;border-collapse:collapse">
                <thead>
                    <tr>
                        <th style="width:50px;padding:12px;border-bottom:2px solid var(--border)">#</th>
                        <th style="padding:12px;border-bottom:2px solid var(--border)">Student ID</th>
                        <th style="padding:12px;border-bottom:2px solid var(--border)">Full name</th>
                        <th style="padding:12px;border-bottom:2px solid var(--border)">Date of birth</th>
                        <th style="padding:12px;border-bottom:2px solid var(--border)">Gender</th>
                    </tr>
                </thead>
                <tbody id="classListModalBody">
                    <tr>
                        <td colspan="5" class="empty" style="text-align:center;padding:20px">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Enrollment action modal -->
<div id="enrollmentModal"
    style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);align-items:center;justify-content:center">
    <div
        style="background:var(--surface,#1e2433);border:1px solid var(--border,#2d3550);border-radius:16px;padding:24px 28px;max-width:460px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.5)">
        <h3 style="margin-bottom:14px;font-size:1.05rem"><i class="fas fa-user-check"
                style="color:var(--primary);margin-right:8px"></i>Update enrollment</h3>
        <p id="enrollmentModalName" style="font-size:.85rem;color:var(--text-muted);margin-bottom:14px"></p>
        <label style="display:block;margin-bottom:10px">Status
            <select id="enrollmentModalStatus"
                style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);margin-top:6px">
                <option value="Enrolled">Enrolled</option>
                <option value="Completed">Completed</option>
                <option value="Dropped">Dropped</option>
            </select>
        </label>
        <label style="display:block;margin-bottom:10px">Transfer to class (optional)
            <select id="enrollmentModalClass"
                style="width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);margin-top:6px">
                <option value="">Keep current class</option>
            </select>
        </label>
        <p id="enrollmentModalMsg" class="message" style="margin-bottom:12px"></p>
        <div style="display:flex;gap:10px">
            <button id="enrollmentModalSave" class="btn btn-primary" style="flex:1"><i class="fas fa-save"></i> Save</button>
            <button id="enrollmentModalClose"
                style="flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer">Cancel</button>
        </div>
    </div>
</div>
